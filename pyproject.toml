[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiomic-driver"
version = "0.1.0"
description = "Background-aware multi-omic candidate-driver prioritisation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "anndata>=0.10",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "rdata>=0.11.2,<1.0; python_version < '3.11'",
  "rdata>=1.1; python_version >= '3.11'",
  "scanpy>=1.10",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not real_data'"
markers = [
  "real_data: optional local regression tests requiring generated GSE288996 artifacts",
]

[tool.ruff]
line-length = 88
target-version = "py310"
