random_seed: 42

rna:
  min_genes: 200
  min_cells_per_gene: 3
  target_sum: 10000
  n_hvg: 3000
  n_pcs: 30

atac:
  min_cells_per_peak: 3
  n_lsi: 30
  harmonize_overlapping_peaks: true

phase4:
  min_cells_per_group: 20
  require_all_groups: true

aggregation:
  method: latent_centroid_mean

ranking:
  combine_method: mean_zscore

validation:
  rankable_candidates: [HIC2]
  external_validation_genes: [ZFPM2]
  expected_primary_candidates: 12
  top_n_candidates: 5
  replicate_consistency_moderate: 0.5
  replicate_consistency_positive: 0.0
  literature_evidence_path: configs/literature_evidence.yaml

sensitivity:
  cell_thresholds: [10, 15, 20, 25, 30]
  modality_rna_weights: [0.0, 0.25, 0.5, 0.75, 1.0]
  winsor_fraction: 0.01
  trim_fraction: 0.05
  primary_analysis_version: primary_v1
